name: "datacore_dbt"
version: "1.0.0"
config-version: 2

# Perfil declarado em profiles.yml (~/.dbt/profiles.yml ou DBT_PROFILES_DIR).
# Use dbt/profiles.example.yml como base.
profile: "datacore"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Pacotes (dbt_utils) fora da pasta do projeto por padrão — quando o projeto
# está num diretório sincronizado (OneDrive), o symlink `integration_tests` do
# dbt_utils vira um reparse point que trava `dbt deps`/rm. O gateway
# (server/dbtRunner.ts) e o Dockerfile definem DBT_PACKAGES_INSTALL_PATH.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

require-dbt-version: [">=1.8.0", "<2.0.0"]

# ---------------------------------------------------------------------------
# Convenção de datasets (BigQuery). Os nomes abaixo são usados VERBATIM pelo
# macro generate_schema_name (macros/generate_schema_name.sql), então cada
# camada cai no seu próprio dataset — espelhando o padrão raw_/bronze_ que o
# gateway já usa em server/routes/bronze.ts e bronzeAutoSync.ts.
# Ajuste por ambiente via variáveis de ambiente.
# ---------------------------------------------------------------------------
vars:
  timezone: "America/Sao_Paulo"
  # Statuses de transação considerados "sucesso" nas camadas Silver/Gold.
  status_sucesso: ["APROVADO", "PAID", "SUCCESS", "CAPTURADO"]

models:
  datacore_dbt:
    # Camadas do medalhão. Os .sql são organizados por camada:
    #   models/medallion/bronze/bronze_<tabela>.sql   (gerado por server/dbtCodegen.ts)
    #   models/medallion/silver/  e  models/medallion/gold/
    # Um arquivo por tabela; a regeração sobrescreve. O gateway roda
    # `dbt build --select bronze_<t1> bronze_<t2> ...` (a lista de tabelas da
    # integração). O schema de saída vem de DBT_SCHEMA_* (o gateway seta por
    # requisição). Os modelos de EXEMPLO (transacoes) trazem
    # `enabled = env_var('DBT_DEMO_ENABLED','true') == 'true'` no próprio arquivo.
    staging:
      +materialized: view
      +schema: "{{ env_var('DBT_SCHEMA_STAGING', 'staging') }}"
    medallion:
      bronze:
        +materialized: incremental
        +schema: "{{ env_var('DBT_SCHEMA_BRONZE', 'bronze') }}"
        +on_schema_change: append_new_columns
        +tags: ["lakehouse", "bronze"]
      silver:
        +materialized: table
        +schema: "{{ env_var('DBT_SCHEMA_SILVER', 'silver') }}"
        +tags: ["lakehouse", "silver"]
      gold:
        +materialized: table
        +schema: "{{ env_var('DBT_SCHEMA_GOLD', 'gold') }}"
        +tags: ["lakehouse", "gold", "bi"]

seeds:
  datacore_dbt:
    # O seed de demonstração simula a zona RAW do Airbyte, então ele cai no
    # mesmo dataset apontado por DBT_RAW_DATASET — assim source() acha a tabela
    # sem configuração extra em modo de teste local.
    +schema: "{{ env_var('DBT_RAW_DATASET', 'raw') }}"
    raw_transacoes:
      +column_types:
        _airbyte_raw_id: string
        _airbyte_extracted_at: timestamp
        id_transacao: string
        valor: numeric
        status: string
        cpf_titular: string
        numero_cartao: string
        email_comprador: string
        data_transacao: timestamp
