version: 2

# _properties.yml — sistema "SAP" (sap), camada Silver.
# TODOS os modelos deste sistema. GERADO por server/dbtCodegen.ts a partir de
# dbt/_generated_silver.json — não editar à mão.
models:
  - name: silver_sap_dbt_execucoes
    description: "Silver gerado — tabela dbt_execucoes."
    columns:
      - name: id_modelo
        description: "Campo raw correspondente: \"modelo_id\"."
      - name: dth_criado
        description: "Campo raw correspondente: \"criado_em\"."
      - name: des_log
        description: "Campo raw correspondente: \"log\"."
      - name: dth_finalizado
        description: "Campo raw correspondente: \"finalizado_em\"."
      - name: des_disparado_por
        description: "Campo raw correspondente: \"disparado_por\"."
      - name: id_dbt_execucao
        description: "Campo raw correspondente: \"id\"."
        data_tests: [unique, not_null]
      - name: des_sucesso
        description: "Campo raw correspondente: \"sucesso\"."
      - name: dth_iniciado
        description: "Campo raw correspondente: \"iniciado_em\"."
      - name: des_status
        description: "Campo raw correspondente: \"status\"."
      - name: dt_ingestao_lake
        description: "Data de ingestão no lake — marca d'água do Airbyte (derivada de
          _airbyte_extracted_at)."
      - name: _dbt_loaded_at
        description: "Data/hora em que este build do dbt foi executado
          (current_timestamp())."
