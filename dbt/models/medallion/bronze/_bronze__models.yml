version: 2

models:
  - name: bronze_transacoes
    description: >
      Camada Bronze: dados tipados, deduplicados por CDC e com PII anonimizada
      (LGPD Art. 46). Materialização incremental (merge por id_transacao,
      particionado por dia de ingestão).
    columns:
      - name: id_transacao
        description: "Chave de negócio única após deduplicação CDC."
        data_tests:
          - unique
          - not_null
      - name: valor_transacao
        description: "Valor financeiro (NUMERIC, 2 casas). NULL se a origem vier inconversível."
      - name: status_transacao
        data_tests:
          - not_null
          - accepted_values:
              values: ["APROVADO", "PENDENTE", "CANCELADO", "RECUSADO", "PAID", "SUCCESS", "CAPTURADO", "FAILED"]
              config:
                severity: warn
      - name: cpf_titular_mascarado
        description: "CPF sem PII em claro (redação parcial determinística)."
      - name: numero_cartao_hash
        description: "SHA-256 hex do PAN — irreversível."
      - name: email_comprador_tokenizado
        description: "local-part hasheada; domínio preservado para analytics."
      - name: dt_ingestao_lake
        data_tests: [not_null]
