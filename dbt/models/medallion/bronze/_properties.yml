version: 2

# _properties.yml — modelos de EXEMPLO da camada Bronze (bronze_transacoes).
# Só participam do build com DBT_DEMO_ENABLED=true.
# Os modelos gerados ficam em models/medallion/bronze/<sistema>/_properties.yml.
models:
  - name: bronze_transacoes
    description: "EXEMPLO — Bronze do seed transacoes (só com DBT_DEMO_ENABLED=true)."
    columns:
      - name: id_transacao
        data_tests: [unique, not_null]
      - name: status_transacao
        data_tests:
          - not_null
          - accepted_values:
              values: ["APROVADO", "PENDENTE", "CANCELADO", "RECUSADO", "PAID", "SUCCESS", "CAPTURADO", "FAILED"]
              config:
                severity: warn
      - name: dt_ingestao_lake
        data_tests: [not_null]
