# Build + deploy do gateway (server/) no Cloud Run.
#   gcloud builds submit --config cloudbuild.gateway.yaml \
#     --substitutions=_IMAGE=REGIAO-docker.pkg.dev/PROJ/datacore/gateway:TAG,_REGION=southamerica-east1,_SERVICE=airbyte-gateway,_RUNTIME_SA=489189813509-compute@developer.gserviceaccount.com
# (_SERVICE e _RUNTIME_SA acima já são os valores reais de produção — nomes
# herdados do primeiro deploy manual, diferentes do que a Seção 1 do
# DEPLOY.md recomenda criar (SA dedicada "datacore-gateway-run"); ver DEPLOY.md § 3.)
#
# Segredos (SUPABASE_SERVICE_ROLE_KEY, AIRBYTE_CLIENT_SECRET, GATEWAY_API_KEY,
# BIGQUERY_CREDENTIALS_JSON) vêm do Secret Manager via --set-secrets — nunca
# como env var em texto. Config não sensível vai em --set-env-vars.
# Nomes acima = variável de ambiente dentro do container. O NOME DO SEGREDO no
# Secret Manager é outro — em produção, kebab-case (supabase-service-role-key,
# airbyte-client-secret, gateway-api-key, bigquery-credentials-json), não
# SCREAMING_SNAKE_CASE; ver DEPLOY.md § 3.
#
# DBT_DEMO_ENABLED=false: desliga os modelos de EXEMPLO (transacoes). O gateway
# só constrói os modelos gerados em models/medallion/bronze/bronze_<t>.sql.
# server/dbtRunner.ts já força isso no ambiente do `dbt build`; declarar aqui
# deixa explícito e cobre invocação manual de `dbt` no container.
#
# DBT_CODEGEN_GIT=push (habilitado 2026-09-17, ver incidente arena_fahel_beach em
# project_gateway_deploy): toda integração criada em produção dá `git commit` +
# `git push` pro repo automaticamente (server/dbtCodegen.ts::gitCommit), em vez
# de ficar só no disco efêmero do container até o próximo redeploy apagar.
# Exige: (1) .git dentro da imagem — ver .gcloudignore/.dockerignore, NÃO
# excluem mais .git; (2) a secret dbt-codegen-deploy-key (deploy key SSH com
# write access no repo, ver server/gitDeployKey.ts) montada como arquivo em
# /secrets/dbt-codegen-deploy-key; (3) GIT_PUSH_REMOTE_URL apontando pro
# remote SSH (gitCommit reescreve `origin` pra essa URL antes do push).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '-f', 'Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--service-account=${_RUNTIME_SA}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=900'
      - '--max-instances=1'
      - '--cpu-boost'
      - '--set-env-vars=SUPABASE_URL=${_SUPABASE_URL},AIRBYTE_BASE_URL=${_AIRBYTE_BASE_URL},AIRBYTE_CLIENT_ID=${_AIRBYTE_CLIENT_ID},AIRBYTE_WORKSPACE_ID=${_AIRBYTE_WORKSPACE_ID},DBT_TARGET=prod,DBT_GCP_PROJECT=${_DBT_GCP_PROJECT},DBT_GCP_LOCATION=${_REGION},DBT_PROJECT_DIR=/app/dbt,DBT_PROFILES_DIR=/app/dbt,DBT_DEMO_ENABLED=false,DBT_DISABLED=${_DBT_DISABLED},DBT_CODEGEN_GIT=${_DBT_CODEGEN_GIT},GIT_PUSH_REMOTE_URL=${_GIT_PUSH_REMOTE_URL},GIT_AUTHOR_NAME=DataCore Gateway,GIT_AUTHOR_EMAIL=gateway@datacore.local'
      - '--set-secrets=SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,AIRBYTE_CLIENT_SECRET=airbyte-client-secret:latest,GATEWAY_API_KEY=gateway-api-key:latest,BIGQUERY_CREDENTIALS_JSON=bigquery-credentials-json:latest,/secrets/dbt-codegen-deploy-key=dbt-codegen-deploy-key:latest'

images:
  - '${_IMAGE}'

substitutions:
  _REGION: southamerica-east1
  _SERVICE: airbyte-gateway
  _IMAGE: ''            # obrigatório
  # Default = SA padrão do Compute, a que o serviço real usa hoje (nenhuma SA
  # dedicada foi criada — ver aviso no topo do arquivo). Sobrescreva se migrar
  # para uma SA dedicada.
  _RUNTIME_SA: '489189813509-compute@developer.gserviceaccount.com'
  _SUPABASE_URL: ''
  # IP estático (datacore-airbyte-vm-ip, reservado 2026-09-15) — antes era
  # efêmero e mudava a cada stop/start da VM.
  _AIRBYTE_BASE_URL: 'http://34.39.199.115:8000'
  _AIRBYTE_CLIENT_ID: ''
  _AIRBYTE_WORKSPACE_ID: ''
  _DBT_GCP_PROJECT: data-plataform-dev
  _DBT_DISABLED: 'false'
  # off | commit | push — 'commit' é um no-op prático em Cloud Run (commit fica
  # preso no filesystem efêmero do container, nunca visível); só 'push' resolve
  # de verdade. Habilitado em produção 2026-09-17 — ver comentário acima.
  _DBT_CODEGEN_GIT: 'push'
  # Remote SSH que gitCommit() usa pra dar push (reescreve `origin` pra esta URL
  # antes de cada push) — autentica com a deploy key em dbt-codegen-deploy-key.
  _GIT_PUSH_REMOTE_URL: 'git@github.com:jeffersonbh1/datacore.git'

options:
  logging: CLOUD_LOGGING_ONLY
